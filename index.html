<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syahrul AI Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/face-api.js/0.22.2/face-api.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --neon: #00ffe7;
    --neon2: #ff00c8;
    --dark: #050a0e;
    --darker: #020507;
    --glass: rgba(0,255,231,0.05);
    --glass2: rgba(0,255,231,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--neon);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,231,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,231,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    animation: gridMove 20s linear infinite;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 20px 0 10px;
  }

  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.2rem, 5vw, 2rem);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--neon), var(--neon2), var(--neon));
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: 0% }
    100% { background-position: 200% }
  }

  .header p {
    font-size: 0.85rem;
    color: rgba(0,255,231,0.5);
    letter-spacing: 2px;
    margin-top: 6px;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--glass);
    border: 1px solid rgba(0,255,231,0.15);
    border-radius: 8px;
    font-size: 0.8rem;
    letter-spacing: 1px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff4444;
    transition: background 0.3s;
    flex-shrink: 0;
  }

  .status-dot.active { 
    background: var(--neon); 
    box-shadow: 0 0 8px var(--neon);
    animation: pulse 1.5s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  #statusText { color: rgba(0,255,231,0.7); }

  /* Camera section */
  .camera-section {
    position: relative;
    background: var(--darker);
    border: 1px solid rgba(0,255,231,0.2);
    border-radius: 12px;
    overflow: hidden;
  }

  .camera-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    max-height: 340px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    transform: scaleX(-1);
  }

  .cam-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: rgba(0,255,231,0.3);
  }

  .cam-icon {
    font-size: 3rem;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  /* Corner decorations */
  .corner {
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: var(--neon);
    border-style: solid;
    z-index: 5;
  }
  .corner.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

  /* Greeting overlay */
  .greeting-overlay {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    border: 1px solid var(--neon);
    border-radius: 8px;
    padding: 8px 16px;
    text-align: center;
    display: none;
    z-index: 10;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }

  .greeting-overlay.show { display: block; animation: fadeIn 0.5s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .greeting-text {
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.7rem, 3vw, 0.95rem);
    color: var(--neon);
    text-shadow: 0 0 10px var(--neon);
  }

  .greeting-sub {
    font-size: 0.72rem;
    color: rgba(0,255,231,0.6);
    margin-top: 2px;
  }

  /* Start button */
  .btn-start {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--neon);
    color: var(--neon);
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .btn-start::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--neon);
    transform: translateX(-100%);
    transition: transform 0.3s;
    z-index: -1;
  }

  .btn-start:hover::before { transform: translateX(0); }
  .btn-start:hover { color: var(--dark); }
  .btn-start:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Chat section */
  .chat-section {
    background: var(--glass);
    border: 1px solid rgba(0,255,231,0.15);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .chat-header {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(0,255,231,0.1);
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: rgba(0,255,231,0.6);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #chatBox {
    height: 280px;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(0,255,231,0.2) transparent;
  }

  #chatBox::-webkit-scrollbar { width: 4px; }
  #chatBox::-webkit-scrollbar-thumb { background: rgba(0,255,231,0.2); border-radius: 2px; }

  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.88rem;
    line-height: 1.5;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.ai {
    align-self: flex-start;
    background: rgba(0,255,231,0.08);
    border: 1px solid rgba(0,255,231,0.2);
    color: rgba(0,255,231,0.9);
    border-bottom-left-radius: 2px;
  }

  .msg.user {
    align-self: flex-end;
    background: rgba(255,0,200,0.1);
    border: 1px solid rgba(255,0,200,0.25);
    color: rgba(255,255,255,0.85);
    border-bottom-right-radius: 2px;
  }

  .msg-label {
    font-size: 0.65rem;
    opacity: 0.5;
    margin-bottom: 4px;
    letter-spacing: 1px;
    font-family: 'Orbitron', monospace;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 8px;
    align-self: flex-start;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: var(--neon);
    border-radius: 50%;
    animation: bounce 1s ease infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    display: flex;
    gap: 0;
    border-top: 1px solid rgba(0,255,231,0.1);
  }

  #chatInput {
    flex: 1;
    padding: 14px 16px;
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.9);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    outline: none;
  }

  #chatInput::placeholder { color: rgba(0,255,231,0.25); }

  #sendBtn {
    padding: 14px 20px;
    background: transparent;
    border: none;
    border-left: 1px solid rgba(0,255,231,0.1);
    color: var(--neon);
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  #sendBtn:hover { background: rgba(0,255,231,0.1); }
  #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Loading model */
  .loading-bar {
    height: 2px;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    width: 0%;
    transition: width 0.5s;
    position: absolute;
    bottom: 0;
    left: 0;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>SYAHRUL // AI</h1>
    <p>PERSONAL ASSISTANT · FACE RECOGNITION · POWERED BY GABUT</p>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Memuat model AI... harap tunggu</span>
  </div>

  <div class="camera-section">
    <div class="camera-wrap" id="cameraWrap">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div class="cam-placeholder" id="placeholder">
        <div class="cam-icon">📡</div>
        <div style="font-size:0.8rem;letter-spacing:2px;">KAMERA BELUM AKTIF</div>
      </div>

      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>

      <div class="greeting-overlay" id="greetingOverlay">
        <div class="greeting-text" id="greetingText"></div>
        <div class="greeting-sub" id="greetingSub"></div>
      </div>

      <div class="loading-bar" id="loadingBar"></div>
    </div>

    <button class="btn-start" id="startBtn" disabled onclick="startCamera()">
      ◉ AKTIFKAN KAMERA
    </button>
  </div>

  <div class="chat-section">
    <div class="chat-header">
      <span>◈</span> TERMINAL KOMUNIKASI
    </div>
    <div id="chatBox">
      <div class="msg ai">
        <div class="msg-label">SISTEM</div>
        Halo! Aktifkan kamera dulu ya Bos, biar aku bisa kenali kamu. Setelah itu kita bisa ngobrol bebas! 🤙
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="chatInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button id="sendBtn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<script>
const API_KEY = "AIzaSyAiV8w8UJQKkIVIVxt7w60nx2PVcft46kM";
const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;

const USER_NAME = "Bos Syahrul";
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

let faceDetected = false;
let greeted = false;
let detecting = false;
let chatHistory = [];
let stream = null;

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const startBtn = document.getElementById('startBtn');
const loadingBar = document.getElementById('loadingBar');
const greetingOverlay = document.getElementById('greetingOverlay');
const greetingText = document.getElementById('greetingText');
const greetingSub = document.getElementById('greetingSub');
const chatBox = document.getElementById('chatBox');
const chatInput = document.getElementById('chatInput');

// Load face-api models
async function loadModels() {
  try {
    setStatus('Memuat model deteksi wajah...', false);
    loadingBar.style.width = '30%';

    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    loadingBar.style.width = '70%';
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
    loadingBar.style.width = '100%';

    setTimeout(() => loadingBar.style.width = '0%', 500);
    setStatus('Model siap! Klik tombol untuk aktifkan kamera', false);
    startBtn.disabled = false;
  } catch (e) {
    setStatus('Gagal muat model: ' + e.message, false);
  }
}

function setStatus(text, active) {
  statusText.textContent = text;
  statusDot.className = 'status-dot' + (active ? ' active' : '');
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    video.style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
    startBtn.disabled = true;
    startBtn.textContent = '◉ KAMERA AKTIF';
    setStatus('Kamera aktif — mendeteksi wajah...', true);

    video.addEventListener('loadedmetadata', () => {
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
      detectFace();
    });
  } catch (e) {
    setStatus('Gagal akses kamera: ' + e.message, false);
  }
}

async function detectFace() {
  if (detecting) return;
  detecting = true;

  const loop = async () => {
    if (!stream) return;

    const detections = await faceapi
      .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.4 }))
      .withFaceLandmarks(true);

    ctx.clearRect(0, 0, overlay.width, overlay.height);

    const scaleX = overlay.width / video.videoWidth;
    const scaleY = overlay.height / video.videoHeight;

    if (detections.length > 0) {
      faceDetected = true;

      detections.forEach(d => {
        const box = d.detection.box;
        const x = box.x * scaleX;
        const y = box.y * scaleY;
        const w = box.width * scaleX;
        const h = box.height * scaleY;

        // Draw glowing box
        ctx.shadowColor = '#00ffe7';
        ctx.shadowBlur = 15;
        ctx.strokeStyle = '#00ffe7';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);

        // Corner accents
        ctx.shadowBlur = 0;
        const cs = 12;
        ctx.lineWidth = 3;
        [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(([cx,cy], i) => {
          ctx.beginPath();
          if (i === 0) { ctx.moveTo(cx, cy+cs); ctx.lineTo(cx, cy); ctx.lineTo(cx+cs, cy); }
          if (i === 1) { ctx.moveTo(cx-cs, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy+cs); }
          if (i === 2) { ctx.moveTo(cx, cy-cs); ctx.lineTo(cx, cy); ctx.lineTo(cx+cs, cy); }
          if (i === 3) { ctx.moveTo(cx-cs, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy-cs); }
          ctx.stroke();
        });
      });

      if (!greeted) {
        greeted = true;
        showGreeting();
        sendAIGreeting();
      }

      setStatus(`Wajah terdeteksi — ${detections.length} orang`, true);
    } else {
      faceDetected = false;
      setStatus('Tidak ada wajah terdeteksi...', true);

      if (greeted) {
        greeted = false;
        greetingOverlay.classList.remove('show');
      }
    }

    requestAnimationFrame(loop);
  };

  loop();
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 11) return 'Selamat Pagi';
  if (h < 15) return 'Selamat Siang';
  if (h < 18) return 'Selamat Sore';
  return 'Selamat Malam';
}

function showGreeting() {
  const now = new Date();
  const time = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  greetingText.textContent = `${getGreeting()}, ${USER_NAME}!`;
  greetingSub.textContent = `${time} · Wajah Dikenali ✓`;
  greetingOverlay.classList.add('show');
}

async function sendAIGreeting() {
  const greet = getGreeting();
  const prompt = `Kamu adalah AI assistant personal bernama "SYS-AI" untuk seseorang bernama "${USER_NAME}". Kamu baru saja mendeteksi wajahnya lewat kamera. Buat sapaan pembuka yang singkat, hangat, dan sedikit keren/futuristik. Maksimal 2 kalimat. Gunakan Bahasa Indonesia. Sapa dengan nama "${USER_NAME}".`;

  addMsg('ai', '...', true);
  const reply = await callGemini(prompt, true);
  removeTyping();
  addMsg('ai', reply);

  chatHistory.push({ role: 'model', parts: [{ text: reply }] });
}

async function sendMsg() {
  const text = chatInput.value.trim();
  if (!text) return;

  chatInput.value = '';
  addMsg('user', text);
  chatHistory.push({ role: 'user', parts: [{ text }] });

  addMsg('ai', '...', true);
  document.getElementById('sendBtn').disabled = true;

  const reply = await callGemini(text, false);
  removeTyping();
  addMsg('ai', reply);
  chatHistory.push({ role: 'model', parts: [{ text: reply }] });

  document.getElementById('sendBtn').disabled = false;
}

async function callGemini(text, isGreeting) {
  try {
    const systemCtx = `Kamu adalah SYS-AI, asisten AI personal untuk "${USER_NAME}". Kamu terintegrasi dengan sistem kamera face recognition. Jawab dalam Bahasa Indonesia, dengan nada santai tapi sedikit futuristik. Singkat dan padat.`;

    let messages = [];

    if (isGreeting) {
      messages = [{ role: 'user', parts: [{ text: systemCtx + '\n\n' + text }] }];
    } else {
      const systemMsg = { role: 'user', parts: [{ text: systemCtx }] };
      const systemAck = { role: 'model', parts: [{ text: 'Siap, aku adalah SYS-AI!' }] };
      messages = [systemMsg, systemAck, ...chatHistory.slice(-10)];
    }

    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: messages,
        generationConfig: { temperature: 0.8, maxOutputTokens: 300 }
      })
    });

    const data = await res.json();
    if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
      return data.candidates[0].content.parts[0].text;
    }
    return 'Sinyal lemah, coba lagi ya Bos...';
  } catch (e) {
    return 'Koneksi error: ' + e.message;
  }
}

function addMsg(role, text, isTyping = false) {
  const div = document.createElement('div');
  div.className = `msg ${role}` + (isTyping ? ' typing-msg' : '');

  if (isTyping) {
    div.innerHTML = `<div class="msg-label">${role === 'ai' ? 'SYS-AI' : USER_NAME}</div><div class="typing"><span></span><span></span><span></span></div>`;
  } else {
    div.innerHTML = `<div class="msg-label">${role === 'ai' ? 'SYS-AI' : USER_NAME}</div>${text}`;
  }

  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTyping() {
  const t = chatBox.querySelector('.typing-msg');
  if (t) t.remove();
}

// Init
loadModels();
</script>
</body>
</html>
